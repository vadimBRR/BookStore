<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta
            name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <link rel="stylesheet" href="/static/style.css"/>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
            integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
            crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


    <style type="text/css">
        body {
            background-color: #f1f1f1;
        }

        .add-block {
            background-color: white;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 1px 3px 0px, rgba(0, 0, 0, 0.06) 0px 1px 2px 0px;
            border-radius: 10px;
            padding: 20px;
        }

        .btn-light {
            background-color: inherit;
            border: 0px;
        }

        .itd-btn:hover {
            background-color: rgba(207, 207, 207, 0.728);
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            /* display: none; <- Crashes Chrome on hover */
            -webkit-appearance: none;
            margin: 0; /* <-- Apparently some margin are still there even though it's hidden */
        }
    </style>
    <title>BookStore</title>
</head>
<body>
<navbar>

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark py-3">
        <div class="container-fluid  ">
            <a class="navbar-brand" href="#">BookStore</a>
            <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup"
                    aria-controls="navbarNavAltMarkup"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav mr-auto">
                    <a class="nav-link" aria-current="page" href="/">Головна</a>
                    <a class="nav-link " href="/books">Книжки</a>
                    <a class="nav-link " href="/add">Добавити книжку</a>
                </div>
                <div class="navbar-nav">
                    <a class="nav-link active" href="/add">Авторизуватись</a>
                </div>
            </div>
        </div>
    </nav>
</navbar>
<section class="add-product py-5 mt-4   ">
    <div class="container  ">

        <div class="row justify-content-center ">
            <div class="col-8 ">
                <div class="back d-flex align-items-center ">
                    <a href="/books"><i class="fas fa-arrow-left-long mr-2 btn btn-light"></i></a>
                    <h2 class="py-3 ">Корзина</h2>
                </div>
                <div th:unless="${books.isEmpty()}">
                    <div th:each="book, idx : ${books}" class="row justify-content-around add-block mb-5">
                        <div class="col-2">
                            <img
                                    alt=""
                                    th:src="'data:image/jpeg;base64,' + ${book.image}"
                                    style="max-width: 128px; max-height: 200px"
                            />
                        </div>
                        <div class="col-9 g-0 ">
                            <h4 th:text="${book.name}" style="margin: 0"></h4>
                            <p th:text="${book.author_book}" style="margin: 0"></p>
                            <h5 th:text="${book.price}+'₴'"></h5>
                            <p th:text="${book.description}" s></p>
                            <div class="d-flex mb-3">
                                <div class="input-group d-flex me-2" style="width: 100px">
                                    <form th:if="${count.get(idx.index)>1}" action="#" th:action="@{/minus_amount/{id}(id=${book.getId()})}" method="post">
                                        <button type="submit " class="input-group-text btn-dark">-</button>
                                    </form>
                                    <div th:unless="${count.get(idx.index)>1}" action="#">
                                        <button class="input-group-text " disabled>-</button>
                                    </div>

                                    <input type="number" class="form-control bg-body" readonly   th:value="${count.get(idx.index)}">
                                    <form th:if="${count.get(idx.index)<9}" action="#" th:action="@{/plus_amount/{id}(id=${book.getId()})}" method="post">
                                        <button type="submit" class="input-group-text btn-dark">+</button>
                                    </form>
                                    <div th:unless="${count.get(idx.index)<9}" action="#">
                                        <button class="input-group-text " disabled>+</button>
                                    </div>
                                </div>
                                <form action="#" th:action="@{/delete_basket/{id}/basket(id=${book.getId()})}"
                                      method="post" class="me-2">
                                    <button class="btn btn-warning" type="submit">
                                        <i class="fas fa-xmark pe-1"></i>Видалити
                                    </button>
                                </form>
                                <button class="btn btn-danger">
                                    <i class="fas fa-heart"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class=" d-flex justify-content-end mb-4 g-0 ">
                        <form action="/basket/clear_all" method="post">
                            <button type="submit" class="btn btn-lg btn-danger me-3 ">Видалити все</button>
                        </form>

                        <!-- Button trigger modal -->
                        <button type="button" class="btn btn-lg btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal">
                            Замовити
                        </button>

                        <!-- Modal -->
                        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="exampleModalLabel">Замовити</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <p>Будь ласка, заповніть форму, щоб зробити замовлення</p>
                                        <form action="/order" method="post">
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control" id="floatingName" placeholder="Name">
                                                <label for="floatingName">Ім'я</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input type="text" class="form-control" id="floatingSurname" placeholder="Surname">
                                                <label for="floatingSurname">Прізвище</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com">
                                                <label for="floatingEmail">Пошта</label>
                                            </div>
                                            <div class="form-floating  mb-5">
                                                <input type="text" class="form-control" id="floatingPhone" placeholder="Phone">
                                                <label for="floatingPhone">Номер телефону</label>
                                            </div>
                                            <p>Адреса доставки</p>
                                            <div class="form-floating mb-3">
                                                <select class="form-select" id="floatingSelectGrid" aria-label="Country">
                                                    <option value="1" selected>Україна</option>
                                                    <option value="2">Словаччина</option>
                                                    <option value="3">Америка</option>
                                                </select>
                                                <label for="floatingSelectGrid">Країна</label>
                                            </div>
                                            <div class="form-floating  mb-3">
                                                <input type="text" class="form-control" id="floatingCity" placeholder="Напишіть місто">
                                                <label for="floatingCity">Місто</label>
                                            </div>

                                            <div class="form-floating  mb-3">
                                                <input type="text" class="form-control" id="floatingAddress" placeholder="Напишіть адресу">
                                                <label for="floatingAddress">Адреса</label>
                                            </div>

                                            <div class="form-floating  mb-3">
                                                <input type="text" class="form-control" id="floatingZip" placeholder="Zip">
                                                <label for="floatingZip">Індекс</label>
                                            </div>
                                        </form>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                                        <a href="https://secure.wayforpay.com/button/bc44368f6111a" style="display:inline-block!important;background:#0488cd;background-size:cover;width: 256px!important;height:54px!important;border:none!important;border-radius:14px!important;padding:18px!important;text-decoration:none!important;box-shadow:3px 2px 8px rgba(71,66,66,0.22)!important;text-align:center!important;outline:none!important;" onmouseover="this.style.opacity='0.8';" onmouseout="this.style.opacity='1';"> <span style="font-family:Verdana,Arial,sans-serif!important;font-weight:bold!important;font-size:14px!important;color:#ffffff!important;line-height:18px!important;vertical-align:middle!important;">Оплатити</span></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${books.isEmpty()}"  class="d-flex justify-content-center" style="font-size: 60px; ">
                    <p>Добавте товар</p>
                </div>
            </div>
        </div>
    </div>




</section>


<script
        src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"
></script>
<script
        src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"
></script>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
        crossorigin="anonymous"
></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"></script>
</body>

</html>

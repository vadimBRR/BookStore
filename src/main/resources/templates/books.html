<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style type="text/css">
      body {
        background-color: #f1f1f1;
      }
      .add-block {
        background-color: white;
        box-shadow: rgba(0, 0, 0, 0.1) 0px 1px 3px 0px, rgba(0, 0, 0, 0.06) 0px 1px 2px 0px;
        border-radius: 10px;
        padding: 20px;
      }
      .btn-light {
        background-color: inherit;
        border: 0px;
      }
      .line{
        width: 100%;
        height: 1px;
        border: 1px solid rgba(167, 167, 167, 0.541);
      }
    </style>
    <title>BookStore</title>
  </head>
  <body>
    <navbar >

      <nav class="navbar navbar-expand-lg navbar-dark fixed-top bg-dark py-3">
        <div class="container-fluid  ">
          <a class="navbar-brand" href="#">BookStore</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav mr-auto">
                  <a class="nav-link" aria-current="page" href="/">Головна</a>
                  <a class="nav-link active" href="/books">Книжки</a>
                  <a class="nav-link" href="/add">Добавити книжку</a>
                </div>
              <div class="navbar-nav">
                <a class="nav-link" href="/basket">Корзина</a>
              </div>
          </div>
        </div>
      </nav>
    </navbar>

    <section class="add-product py-5 mt-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-8">
            <div class="back d-flex align-items-center mb-1">
              <h2 class="py-3">Книжки</h2>
            </div>

            <div th:each="book, idx : ${books}" class="row justify-content-around">
              <div class="col-2">
                <img
                  alt=""
                  th:src="'data:image/jpeg;base64,' + ${book.image}"
                  style="max-width: 128px; max-height: 200px"
                />
              </div>
              <div class="col-9 g-0 ">
<!--                <h4 th:text="}" style="margin: 0"></h4>-->
                <h4 th:text="${book.name}" style="margin: 0"></h4>
                <p th:text="${book.author_book}" style="margin: 0"></p>
                <h5 th:text="${book.price}+'₴'"></h5>
                <p th:text="${book.description}" s></p>
                <div class="d-flex">

                <form th:if="${is_basket[idx.index].equals(false)}" action="#" th:action="@{/add_basket/{id}(id=${book.getId()})}" method="post" class="pe-2">
                  <button class="btn btn-success" type="submit">
                    <i class="fas fa-bag-shopping"></i> В корзину
                  </button>
                </form>
                  <form th:unless="${is_basket[idx.index].equals(false)}" action="#" th:action="@{/delete_basket/{id}/books(id=${book.getId()})}" method="post" class="pe-2">
                    <button class="btn btn-warning" type="submit">
                      <i class="fas fa-xmark pe-1"></i>Відмінити
                    </button>
                  </form>
                  <button class="btn btn-danger">
                    <i class="fas fa-heart"></i>
                  </button>
                </div>

              </div>
                <div class="line my-4"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
      integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
